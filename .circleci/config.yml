version: 2.1
orbs:
  node: circleci/node@5

jobs:
  # Tests pour la branche develop
  install_dependencies:
    executor: node/default
    steps:
      - checkout
      - run: echo "Installing dependencies..."

  code_analysis:
    executor: node/default
    steps:
      - checkout
      - run: echo "Analyzing code..."

  cleaning_packaging:
    executor: node/default
    steps:
      - checkout
      - run: echo "Cleaning and packaging..."

  # Tests pour la branche test
  unit_tests:
    executor: node/default
    steps:
      - checkout
      - run: echo "Running unit tests..."
  
  integration_tests:
    executor: node/default
    steps:
      - checkout
      - run: echo "Running integration tests..."
  
  regression_tests:
    executor: node/default
    steps:
      - checkout
      - run: echo "Running regression tests..."
  
  performance_tests:
    executor: node/default
    steps:
      - checkout
      - run: echo "Running performance tests..."
  
  security_tests:
    executor: node/default
    steps:
      - checkout
      - run: echo "Running security tests..."
  
  compatibility_tests:
    executor: node/default
    steps:
      - checkout
      - run: echo "Running compatibility tests..."
  
  accessibility_tests:
    executor: node/default
    steps:
      - checkout
      - run: echo "Running accessibility tests..."
  
  verification_tests:
    executor: node/default
    steps:
      - checkout
      - run: echo "Running verification tests..."

  # Tests pour la branche production
  prepare_deployment:
    executor: node/default
    steps:
      - checkout
      - run: echo "Preparing deployment environment..."

  deploy_application:
    executor: node/default
    steps:
      - checkout
      - run: echo "Deploying application..."

  verification_tests_prod:
    executor: node/default
    steps:
      - checkout
      - run: echo "Running verification tests..."

  functional_validation_tests:
    executor: node/default
    steps:
      - checkout
      - run: echo "Running functional validation tests..."

  load_tests:
    executor: node/default
    steps:
      - checkout
      - run: echo "Running load tests..."

  final_deployment:
    executor: node/default
    steps:
      - checkout
      - run: echo "Final deployment..."

  monitoring:
    executor: node/default
    steps:
      - checkout
      - run: echo "Monitoring and tracking deployment..."

workflows:
  version: 2
  develop_pipeline:
    jobs:
      - install_dependencies:
          filters:
            branches:
              only: develop
      - code_analysis:
          requires:
            - install_dependencies
          filters:
            branches:
              only: develop
      - cleaning_packaging:
          requires:
            - code_analysis
          filters:
            branches:
              only: develop

  test_pipeline:
    jobs:
      - unit_tests:
          filters:
            branches:
              only: test
      - integration_tests:
          filters:
            branches:
              only: test
      - regression_tests:
          filters:
            branches:
              only: test
      - performance_tests:
          filters:
            branches:
              only: test
      - security_tests:
          filters:
            branches:
              only: test
      - compatibility_tests:
          filters:
            branches:
              only: test
      - accessibility_tests:
          filters:
            branches:
              only: test
      - verification_tests:
          requires:
            - unit_tests
            - integration_tests
            - regression_tests
            - performance_tests
            - security_tests
            - compatibility_tests
            - accessibility_tests
          filters:
            branches:
              only: test

  production_pipeline:
    jobs:
      - prepare_deployment:
          filters:
            branches:
              only: production
      - deploy_application:
          requires:
            - prepare_deployment
          filters:
            branches:
              only: production
      - verification_tests_prod:
          requires:
            - deploy_application
          filters:
            branches:
              only: production
      - functional_validation_tests:
          requires:
            - verification_tests_prod
          filters:
            branches:
              only: production
      - load_tests:
          requires:
            - functional_validation_tests
          filters:
            branches:
              only: production
      - final_deployment:
          requires:
            - load_tests
          filters:
            branches:
              only: production
      - monitoring:
          requires:
            - final_deployment
          filters:
            branches:
              only: production