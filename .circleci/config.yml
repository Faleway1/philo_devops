version: 2.1
orbs:
  node: circleci/node@5

jobs:
  # Stage: Build
  install_dependencies:
    executor: node/default
    steps:
      - checkout
      - run: echo "Installing dependencies..."

  code_analysis:
    executor: node/default
    steps:
      - checkout
      - run: echo "Analyzing code..."

  cleaning_packaging:
    executor: node/default
    steps:
      - checkout
      - run: echo "Cleaning and packaging..."

  # Stage: Tests
  unit_tests:
    executor: node/default
    steps:
      - checkout
      - run: echo "Running unit tests..."
  
  integration_tests:
    executor: node/default
    steps:
      - checkout
      - run: echo "Running integration tests..."
  
  regression_tests:
    executor: node/default
    steps:
      - checkout
      - run: echo "Running regression tests..."
  
  performance_tests:
    executor: node/default
    steps:
      - checkout
      - run: echo "Running performance tests..."
  
  security_tests:
    executor: node/default
    steps:
      - checkout
      - run: echo "Running security tests..."
  
  compatibility_tests:
    executor: node/default
    steps:
      - checkout
      - run: echo "Running compatibility tests..."
  
  accessibility_tests:
    executor: node/default
    steps:
      - checkout
      - run: echo "Running accessibility tests..."

  # Stage: Deploy
  prepare_deployment:
    executor: node/default
    steps:
      - checkout
      - run: echo "Preparing deployment environment..."

  deploy_application:
    executor: node/default
    steps:
      - checkout
      - run: echo "Deploying application..."

  verification_tests:
    executor: node/default
    steps:
      - checkout
      - run: echo "Running verification tests..."

  functional_validation_tests:
    executor: node/default
    steps:
      - checkout
      - run: echo "Running functional validation tests..."

  load_tests:
    executor: node/default
    steps:
      - checkout
      - run: echo "Running load tests..."

  monitoring:
    executor: node/default
    steps:
      - checkout
      - run: echo "Monitoring and tracking deployment..."

workflows:
  version: 2
  build_test_deploy:
    jobs:
      - install_dependencies
      - code_analysis:
          requires:
            - install_dependencies
      - cleaning_packaging:
          requires:
            - code_analysis
      
      - unit_tests:
          requires:
            - cleaning_packaging
      - integration_tests:
          requires:
            - unit_tests
      - regression_tests:
          requires:
            - integration_tests
      - performance_tests:
          requires:
            - regression_tests
      - security_tests:
          requires:
            - performance_tests
      - compatibility_tests:
          requires:
            - security_tests
      - accessibility_tests:
          requires:
            - compatibility_tests
      
      - prepare_deployment:
          requires:
            - accessibility_tests
          filters:
            branches:
              only: [develop, main]
      - deploy_application:
          requires:
            - prepare_deployment
      - verification_tests:
          requires:
            - deploy_application
      - functional_validation_tests:
          requires:
            - verification_tests
      - load_tests:
          requires:
            - functional_validation_tests
      - monitoring:
          requires:
            - load_tests
